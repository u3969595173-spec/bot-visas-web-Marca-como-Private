<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title description">
  <title id="title">1er Torneo de Domino Iberia</title>
  <desc id="description">Promocion del torneo con inscripcion de 50 fichas por pareja, minimo de 30 parejas y 10 rondas suizas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06251f"/>
      <stop offset="0.58" stop-color="#0a4133"/>
      <stop offset="1" stop-color="#081914"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#d6b86a" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="17" flood-color="#00110d" flood-opacity=".58"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#background)"/>
  <rect width="1200" height="1500" fill="url(#grid)"/>
  <path d="M0 1280C250 1100 440 1460 700 1280C900 1140 1040 1180 1200 1080V1500H0Z" fill="#03130f" fill-opacity=".7"/>
  <path d="M0 160C280 60 420 250 700 150C940 65 1080 110 1200 40V0H0Z" fill="#d6b86a" fill-opacity=".08"/>

  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="600" y="128" fill="#d6b86a" font-size="33" font-weight="700" letter-spacing="8">CAPITAL IBERIA PRESENTA</text>
    <text x="600" y="252" fill="#fff7dd" font-size="79" font-weight="700">1ER TORNEO</text>
    <text x="600" y="350" fill="#fff7dd" font-size="102" font-weight="700">DOMINO IBERIA</text>
    <path d="M355 395H845" stroke="#d6b86a" stroke-width="5"/>
  </g>

  <g transform="translate(205 450) rotate(-10 200 235)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="470" rx="30" fill="#f7f0dc" stroke="#d6b86a" stroke-width="10"/>
    <path d="M0 235H400" stroke="#153b30" stroke-width="9"/>
    <g fill="#153b30">
      <circle cx="100" cy="72" r="25"/><circle cx="300" cy="72" r="25"/><circle cx="100" cy="162" r="25"/><circle cx="300" cy="162" r="25"/>
      <circle cx="100" cy="307" r="25"/><circle cx="300" cy="307" r="25"/><circle cx="100" cy="397" r="25"/><circle cx="300" cy="397" r="25"/>
    </g>
  </g>
  <g transform="translate(600 450) rotate(10 200 235)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="470" rx="30" fill="#f7f0dc" stroke="#d6b86a" stroke-width="10"/>
    <path d="M0 235H400" stroke="#153b30" stroke-width="9"/>
    <g fill="#153b30">
      <circle cx="100" cy="72" r="25"/><circle cx="300" cy="72" r="25"/><circle cx="200" cy="117" r="25"/><circle cx="100" cy="162" r="25"/><circle cx="300" cy="162" r="25"/>
      <circle cx="100" cy="307" r="25"/><circle cx="300" cy="307" r="25"/><circle cx="100" cy="397" r="25"/><circle cx="300" cy="397" r="25"/>
    </g>
  </g>

  <g transform="translate(100 1010)">
    <rect width="1000" height="295" rx="12" fill="#f7f0dc"/>
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <text x="500" y="67" fill="#123a2e" font-size="30" font-weight="700" letter-spacing="4">INSCRIPCION</text>
      <text x="500" y="147" fill="#0b2d23" font-family="Georgia, serif" font-size="72" font-weight="700">50 FICHAS POR PAREJA</text>
      <path d="M70 183H930" stroke="#d6b86a" stroke-width="3"/>
      <text x="250" y="245" fill="#123a2e" font-size="29" font-weight="700">MINIMO 30 PAREJAS</text>
      <text x="750" y="245" fill="#123a2e" font-size="29" font-weight="700">10 RONDAS SUIZAS</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="1375" fill="#fff7dd" font-size="35" font-weight="700">PREMIOS PARA EL TOP 8</text>
    <text x="600" y="1435" fill="#d6b86a" font-size="27">FORMA TU PAREJA CON UN CODIGO Y PARTICIPA</text>
  </g>
</svg>