<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Mesa de Domino Iberia</title>
  <desc id="desc">Muestra de una mesa de domino movil con fichas marfil y puntos marrones.</desc>
