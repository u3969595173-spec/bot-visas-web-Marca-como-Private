    <linearGradient id="madera" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#180c07"/><stop offset=".43" stop-color="#704020"/><stop offset=".62" stop-color="#2a1209"/><stop offset="1" stop-color="#0f0705"/></linearGradient>
    <radialGradient id="paño"><stop stop-color="#0877ae"/><stop offset=".72" stop-color="#04517f"/><stop offset="1" stop-color="#023554"/></radialGradient>
