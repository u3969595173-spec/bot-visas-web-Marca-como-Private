    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#020b08" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M0 800C330 670 500 980 810 810C1050 680 1280 800 1600 650V1000H0Z" fill="#06100d" fill-opacity=".5"/>
