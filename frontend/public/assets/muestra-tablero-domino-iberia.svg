      <text x="132" y="335" fill="#e7bd58" font-size="56" font-weight="700">146</text><text x="255" y="335" fill="#acc1b5" font-size="25">/ 200</text>
      <rect x="824" y="230" width="680" height="128" rx="9" fill="#10251f" stroke="#31483f" stroke-width="2"/>
      <text x="860" y="277" fill="#acc1b5" font-size="19">PAREJA 2</text>
      <text x="860" y="335" fill="#eef4ef" font-size="56" font-weight="700">118</text><text x="983" y="335" fill="#acc1b5" font-size="25">/ 200</text>
