      <rect x="430" y="477" width="300" height="78" rx="7" fill="#10251f" stroke="#31483f" stroke-width="2"/><text x="454" y="511" fill="#eef4ef" font-weight="700">Carlos</text><text x="454" y="541" fill="#acc1b5">4 fichas</text>
