<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Muestra del tablero de Domino Iberia</title>
  <desc id="description">Demostracion visual de una mesa oficial en juego con marcador, jugadores, fichas y controles.</desc>
  <defs>
