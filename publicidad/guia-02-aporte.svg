<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#102942"/><path d="M0 830L1080 630V1080H0Z" fill="#091b2d"/><rect x="72" y="65" width="936" height="90" rx="12" fill="#f6c453"/><text x="112" y="122" font-family="Arial" font-size="32" font-weight="800" fill="#071b2d">CAPITAL IBERIA</text><text x="858" y="122" font-family="Arial" font-size="24" font-weight="700" fill="#071b2d">GUÍA 02 / 06</text><text x="72" y="295" font-family="Arial" font-size="92" font-weight="800" fill="white">TU APORTE</text><text x="72" y="390" font-family="Arial" font-size="92" font-weight="800" fill="#f6c453">PASO A PASO</text><rect x="72" y="438" width="150" height="8" fill="#66cfbd"/><g font-family="Arial"><text x="72" y="548" font-size="31" font-weight="700" fill="white">1. Registra la aportación</text><text x="72" y="590" font-size="26" fill="#cad9e2">Indica importe y método desde tu panel.</text><text x="72" y="676" font-size="31" font-weight="700" fill="white">2. Sube el justificante</text><text x="72" y="718" font-size="26" fill="#cad9e2">La administración revisa los datos enviados.</text><text x="72" y="804" font-size="31" font-weight="700" fill="white">3. Estado Activa</text><text x="72" y="846" font-size="26" fill="#cad9e2">Tras aprobarse, aparece en tu cartera.</text></g><text x="72" y="1002" font-family="Arial" font-size="21" fill="#9eb5c5">La disponibilidad y las condiciones dependen de cada operación.</text></svg>