<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#092238"/><rect x="72" y="65" width="936" height="90" rx="12" fill="#f6c453"/><text x="112" y="122" font-family="Arial" font-size="32" font-weight="800" fill="#071b2d">CAPITAL IBERIA</text><text x="858" y="122" font-family="Arial" font-size="24" font-weight="700" fill="#071b2d">GUÍA 03 / 06</text><text x="72" y="290" font-family="Arial" font-size="88" font-weight="800" fill="white">PAGOS DIARIOS</text><text x="72" y="350" font-family="Arial" font-size="31" fill="#c7d9e3">Información que puedes consultar en tu panel.</text><rect x="72" y="420" width="455" height="285" rx="14" fill="#123a55"/><text x="112" y="490" font-family="Arial" font-size="26" font-weight="700" fill="#66cfbd">PORCENTAJE DIARIO</text><text x="112" y="620" font-family="Arial" font-size="96" font-weight="800" fill="#f6c453">0,5%–1,5%</text><text x="112" y="670" font-family="Arial" font-size="23" fill="#c7d9e3">Según la operación y reparto publicado.</text><rect x="553" y="420" width="455" height="285" rx="14" fill="#123a55"/><text x="593" y="490" font-family="Arial" font-size="26" font-weight="700" fill="#66cfbd">LÍMITE OPERATIVO</text><text x="593" y="620" font-family="Arial" font-size="112" font-weight="800" fill="#f6c453">300%</text><text x="593" y="670" font-family="Arial" font-size="23" fill="#c7d9e3">La inversión finaliza al alcanzar el total.</text><rect x="72" y="760" width="936" height="145" rx="12" fill="#f6c453"/><text x="112" y="820" font-family="Arial" font-size="30" font-weight="800" fill="#071b2d">¿DÓNDE LO VEO?</text><text x="112" y="866" font-family="Arial" font-size="27" fill="#071b2d">En “Mis Pagos” e “Inversiones” dentro de tu panel.</text><text x="72" y="1015" font-family="Arial" font-size="21" fill="#9eb5c5">Los resultados y porcentajes dependen de cada operación comercial.</text></svg>